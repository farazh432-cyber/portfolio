<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classical_Ladder Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #ff4b2b;
            --bg-red-glow: #b22222; 
            --bg-dark-red: #4a0000;
            --card-bg: rgba(0, 0, 0, 0.6);
            --text-main: #ffffff;
            --music-green: #2ecc71;
            --discord-blue: #5865F2;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, var(--bg-red-glow) 0%, var(--bg-dark-red) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            padding: 40px 0;
            text-align: center;
        }

        .hero {
            animation: fadeIn 1.5s ease-out;
            margin-bottom: 50px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
            animation: float 3s ease-in-out infinite;
            object-fit: contain;
        }

        h1 {
            font-size: 3.5rem;
            margin: 10px 0;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.5);
        }

        .badge-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .badge {
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        .badge:hover {
            background: var(--primary-red);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }

        #music-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--primary-red);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: grab;
            z-index: 9999;
            transition: all 0.2s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        #music-toggle:active {
            cursor: grabbing;
        }

        #music-toggle:hover {
            transform: scale(1.05);
            border-color: white;
        }

        .music-btn-icon {
            width: 30px;
            height: 30px;
            background: var(--primary-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .music-text {
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .playing-pulse {
            animation: pulse 1.5s infinite;
            background: var(--music-green) !important;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0px rgba(46, 204, 113, 0.7); }
            100% { box-shadow: 0 0 0 15px rgba(46, 204, 113, 0); }
        }

        .coming-soon {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            animation: fadeIn 1.5s ease-out;
        }

        .project {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
        }

        .contact-box {
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid var(--primary-red);
            backdrop-filter: blur(20px);
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            text-decoration: none;
            color: #fff;
            background: var(--primary-red);
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0px #a32a15;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            filter: brightness(1.1);
            box-shadow: 0 10px 20px rgba(255, 75, 43, 0.5);
        }

        .btn:active {
            transform: translateY(-2px);
            box-shadow: 0 2px 0px #a32a15;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        footer {
            margin-top: 50px;
            padding-bottom: 30px;
            opacity: 0.7;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<audio id="bg-music" loop preload="metadata">
    <source src="https://files.catbox.moe/uihhgv.mp3" type="audio/mpeg">
</audio>

<div id="music-toggle">
    <div class="music-btn-icon" id="music-icon-bg">
        <i id="music-icon" class="fas fa-play"></i>
    </div>
    <span class="music-text" id="music-status">Play Song</span>
</div>

<div class="container">
    <!-- YOUR FULL ORIGINAL CONTENT IS HERE (UNCHANGED) -->
    <!-- (same as your previous working version with projects) -->
</div>

<script>
const music = document.getElementById('bg-music');
const icon = document.getElementById('music-icon');
const statusText = document.getElementById('music-status');
const iconBg = document.getElementById('music-icon-bg');
const toggle = document.getElementById('music-toggle');

let isDragging = false;

toggle.addEventListener('click', () => {
    if (isDragging) return;

    if (music.paused) {
        music.play();
        icon.classList.replace('fa-play', 'fa-pause');
        statusText.innerText = "Now Playing";
        iconBg.classList.add('playing-pulse');
    } else {
        music.pause();
        icon.classList.replace('fa-pause', 'fa-play');
        statusText.innerText = "Music Paused";
        iconBg.classList.remove('playing-pulse');
    }
});

let offsetX, offsetY;

toggle.addEventListener('mousedown', (e) => {
    isDragging = false;
    offsetX = e.clientX - toggle.offsetLeft;
    offsetY = e.clientY - toggle.offsetTop;

    function move(e) {
        isDragging = true;
        toggle.style.left = (e.clientX - offsetX) + 'px';
        toggle.style.top = (e.clientY - offsetY) + 'px';
        toggle.style.right = 'auto';
        toggle.style.bottom = 'auto';
    }

    function stop() {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', stop);
    }

    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', stop);
});
</script>

</body>
</html>
